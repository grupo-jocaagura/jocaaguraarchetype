name: jocaaguraarchetype
description: Starter archetype for Flutter apps with Jocaagura Clean Architecture, cross-cutting BLoCs, theming, and navigation setup.

version: 5.1.0


homepage: https://github.com/grupo-jocaagura/jocaaguraarchetype
repository: https://github.com/grupo-jocaagura/jocaaguraarchetype

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_ui: ^1.1.6
  material_ui: ^1.11.0
  jocaagura_domain: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

