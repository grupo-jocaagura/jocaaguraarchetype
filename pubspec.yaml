  jocaagura_domain:
    git:
      url: https://github.com/grupo-jocaagura/jocaagura_domain.git
      ref: 87ee1b879d089e6a05a2b3ec485f979529a16bf9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

