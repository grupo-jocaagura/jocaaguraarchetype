name: jocaaguraarchetype
description: Starter archetype for Flutter apps with Jocaagura Clean Architecture, cross-cutting BLoCs, theming, and navigation setup.
# Integration snapshot: restore publishing after domain 2.0.0 is on pub.dev.
publish_to: none

version: 5.0.0


homepage: https://github.com/jocaagura/jocaaguraarchetype
repository: https://github.com/jocaagura/jocaaguraarchetype

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_ui: ^1.1.6
  material_ui: ^1.11.0
  jocaagura_domain:
    git:
      url: https://github.com/grupo-jocaagura/jocaagura_domain.git
      ref: ec8d831db3305b7e036f1e403aee7727e0a95e2d

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

